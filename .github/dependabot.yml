version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The runtime is Node 22 (.node-version); type definitions stay on their current major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Held at 1.60: the WebKit that Playwright 1.65 ships does not start on the Windows machine
      # the browser tests run on (its Visual C++ runtime is older than that build needs), and the
      # iPhone project is the one that matters most. Remove once that runtime is updated
      # (winget install --id Microsoft.VCRedist.2015+.x64) and `pnpm test:e2e` passes on a newer one.
      - dependency-name: "@playwright/test"
        versions: [">=1.61.0"]
      # Held at 3.x: v4 rewrites the driver below its API (pool, protocol, parameter types) and
      # drizzle-orm is tested against ^3. CI never talks to a database, so a green run proves
      # nothing here. Remove once v4 can be tried against a real database.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
